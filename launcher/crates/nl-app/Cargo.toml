[package]
name = "nl-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "nightclient-launcher"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
iced.workspace = true
image.workspace = true
nl-auth.workspace = true
nl-content.workspace = true
nl-core.workspace = true
nl-java.workspace = true
nl-net.workspace = true
nl-night.workspace = true
nl-platform.workspace = true
open.workspace = true
raw-window-handle = "0.6"
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = "0.7.3"
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-sys = { version = "0.31", features = ["client"] }

[build-dependencies]
embed-resource = "2.5"
