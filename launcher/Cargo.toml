[workspace]
resolver = "3"
members = [
    "crates/nl-platform",
    "crates/nl-net",
    "crates/nl-java",
    "crates/nl-night",
    "crates/nl-auth",
    "crates/nl-content",
    "crates/nl-core",
    "crates/nl-app",
]

[workspace.package]
version = "1.4.0"
edition = "2024"
authors = ["N3moCC"]
license = "MIT"
repository = "https://github.com/N3moCC/NightClient"

[workspace.dependencies]
nl-platform = { path = "crates/nl-platform" }
nl-net = { path = "crates/nl-net" }
nl-java = { path = "crates/nl-java" }
nl-night = { path = "crates/nl-night" }
nl-auth = { path = "crates/nl-auth" }
nl-content = { path = "crates/nl-content" }
nl-core = { path = "crates/nl-core" }

tokio = { version = "1.46", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate", "socks", "multipart"] }
url = "2.5"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2.1"
chacha20poly1305 = "0.10"
rand = "0.8"

directories = "5.0"
fs2 = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "4.2"

uuid = { version = "1.11", features = ["v3", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
open = "5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "svg",
    "tokio",
    "advanced",
    "image",
    "canvas",
] }

tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
smithay-clipboard = { path = "crates/smithay-clipboard" }
