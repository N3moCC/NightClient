name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            file: libnightclient_native.so
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            file: nightclient_native.dll
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            file: libnightclient_native.dylib
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            file: libnightclient_native.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run native lint and tests
        if: matrix.platform != 'macos-x64'
        working-directory: native/nightclient-native
        run: |
          cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
          cargo test --locked --target ${{ matrix.target }}

      - name: Build nightclient-native release binary
        working-directory: native/nightclient-native
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightclient-native-${{ matrix.platform }}
          path: native/nightclient-native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux nightclient-native for JNI tests
        working-directory: native/nightclient-native
        run: cargo build --release --locked

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run common unit tests
        run: ./gradlew --console=plain -PcommonOnly=true test

      - name: Run standalone generator and compatibility checks
        run: |
          python3 tools/checks/test_atmosphere_features.py
          python3 tools/checks/test_compatibility_audit.py
          python3 tools/checks/test_freelook_perspective.py
          python3 tools/checks/test_hitbox_depth.py
          python3 tools/checks/test_optimization_features.py
          python3 tools/checks/test_viewmodel_outline.py

  launcher-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libdbus-1-dev libfontconfig1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run launcher lint and tests
        working-directory: launcher
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
