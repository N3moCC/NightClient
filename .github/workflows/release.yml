name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            file: libnightclient_native.so
            ext: so
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            file: nightclient_native.dll
            ext: dll
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            file: libnightclient_native.dylib
            ext: dylib
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            file: libnightclient_native.dylib
            ext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build nightclient-native
        working-directory: native/nightclient-native
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/nightclient-native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error

  build-launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nightclient-launcher-linux-x64
            bin: nightclient-launcher
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nightclient-launcher-windows-x64.exe
            bin: nightclient-launcher.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nightclient-launcher-macos-arm64
            bin: nightclient-launcher
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nightclient-launcher-macos-x64
            bin: nightclient-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libwayland-dev libdbus-1-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build launcher release binary
        working-directory: launcher
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin nightclient-launcher
      - name: Stage release binary
        shell: bash
        run: cp launcher/target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-mod:
    needs: build-natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download cross-platform native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: staged-natives
      - name: Stage native binaries into mod resources
        run: |
          mkdir -p modules/platform/src/main/resources/assets/nightclient/natives
          for dir in staged-natives/native-*; do
            plat="${dir#staged-natives/native-}"
            mkdir -p "modules/platform/src/main/resources/assets/nightclient/natives/${plat}"
            cp "${dir}"/* "modules/platform/src/main/resources/assets/nightclient/natives/${plat}/"
          done
      - name: Build 24-version universal mod JAR (with bundled natives)
        env:
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
        run: python3 tools/build.py build-universal || python3 tools/build.py build-universal
      - name: Assemble pure-Java universal mod JAR (without bundled natives)
        env:
          GRADLE_OPTS: -Djava.net.preferIPv4Stack=true
        run: python3 tools/build.py assemble-universal --no-native
      - uses: actions/upload-artifact@v4
        with:
          name: nightclient-mod-jars
          path: build/distributions/*.jar
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-natives, build-launcher, build-mod ]
    runs-on: ubuntu-latest
    steps:
      - name: Download mod JARs
        uses: actions/download-artifact@v4
        with:
          name: nightclient-mod-jars
          path: release-assets
      - name: Download launcher binaries
        uses: actions/download-artifact@v4
        with:
          pattern: nightclient-launcher-*
          path: release-assets
          merge-multiple: true
      - name: Download standalone native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: staged-natives
      - name: Collect standalone native libraries with platform names
        run: |
          for dir in staged-natives/native-*; do
            plat="${dir#staged-natives/native-}"
            file="$(ls -1 "${dir}" | head -n1)"
            ext="${file##*.}"
            cp "${dir}/${file}" "release-assets/nightclient-native-${plat}.${ext}"
          done
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
