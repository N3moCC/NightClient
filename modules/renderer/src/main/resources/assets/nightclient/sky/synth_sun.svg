<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="discSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
    <filter id="hazeBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <radialGradient id="sunsetCorona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e4" stop-opacity="0.72"/>
      <stop offset="24%" stop-color="#ffbc82" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#f47292" stop-opacity="0.14"/>
      <stop offset="74%" stop-color="#c02664" stop-opacity="0.03"/>
      <stop offset="94%" stop-color="#9d174d" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunsetPhotosphere" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="44%" stop-color="#ffebb8"/>
      <stop offset="74%" stop-color="#ffad70"/>
      <stop offset="92%" stop-color="#f57584" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#e14d7c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7bd" stop-opacity="0.22"/>
      <stop offset="48%" stop-color="#ff9982" stop-opacity="0.07"/>
      <stop offset="92%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft feathered atmospheric veil near the lower limb -->
    <mask id="hazeVeilMask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <ellipse cx="256" cy="348" rx="165" ry="26" fill="#707070" filter="url(#hazeBlur)"/>
      <ellipse cx="256" cy="376" rx="175" ry="28" fill="#2c2c2c" filter="url(#hazeBlur)"/>
    </mask>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#sunsetCorona)"/>
  <ellipse cx="256" cy="264" rx="224" ry="128" fill="url(#horizonGlow)"/>

  <g mask="url(#hazeVeilMask)">
    <circle cx="256" cy="256" r="106" fill="url(#sunsetPhotosphere)" filter="url(#discSoft)"/>
    <circle cx="256" cy="250" r="64" fill="#fffdf2" opacity="0.54" filter="url(#hazeBlur)"/>
  </g>
</svg>
