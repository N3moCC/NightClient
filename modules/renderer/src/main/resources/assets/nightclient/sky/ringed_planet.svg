<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="planetBands" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.062" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0.52 0    0    0 0.34
        0    0.46 0    0 0.31
        0    0    0.70 0 0.43
        0    0    0    0.38 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="1.4"/>
    </filter>
    <filter id="softEdge" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="ringSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.9"/>
    </filter>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.20"/>
      <stop offset="38%" stop-color="#818cf8" stop-opacity="0.07"/>
      <stop offset="72%" stop-color="#6366f1" stop-opacity="0.015"/>
      <stop offset="92%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="planetBase" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#eae6ff"/>
      <stop offset="28%" stop-color="#baa9ea"/>
      <stop offset="56%" stop-color="#7c6ca8"/>
      <stop offset="82%" stop-color="#3c345e"/>
      <stop offset="100%" stop-color="#19162e"/>
    </linearGradient>

    <radialGradient id="terminatorMaskGrad" cx="34%" cy="32%" r="64%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="42%" stop-color="#f2f2f2" stop-opacity="0.94"/>
      <stop offset="66%" stop-color="#9a9a9a" stop-opacity="0.66"/>
      <stop offset="86%" stop-color="#424242" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#181818" stop-opacity="0.08"/>
    </radialGradient>
    <mask id="planetAlphaMask">
      <circle cx="256" cy="256" r="95" fill="url(#terminatorMaskGrad)" filter="url(#softEdge)"/>
    </mask>

    <radialGradient id="limbRim" cx="30%" cy="28%" r="72%">
      <stop offset="64%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#e0e7ff" stop-opacity="0.20"/>
      <stop offset="97%" stop-color="#f5f3ff" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ringOuterDust" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="59%" stop-color="#c4b5fd" stop-opacity="0.12"/>
      <stop offset="68%" stop-color="#ddd6fe" stop-opacity="0.42"/>
      <stop offset="76%" stop-color="#e2e8f0" stop-opacity="0.48"/>
      <stop offset="80%" stop-color="#94a3b8" stop-opacity="0.05"/>
      <stop offset="84%" stop-color="#94a3b8" stop-opacity="0.04"/>
      <stop offset="89%" stop-color="#cbd5e1" stop-opacity="0.30"/>
      <stop offset="95%" stop-color="#a5b4fc" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringShade" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.58"/>
      <stop offset="84%" stop-color="#64748b" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.12"/>
    </linearGradient>

    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="95"/>
    </clipPath>
    <clipPath id="backRingClip">
      <rect x="0" y="0" width="512" height="256"/>
    </clipPath>
    <clipPath id="frontRingClip">
      <rect x="0" y="256" width="512" height="256"/>
    </clipPath>

    <mask id="ringCastShadowMask">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <ellipse cx="332" cy="222" rx="96" ry="42" fill="#181818" filter="url(#shadowBlur)"/>
    </mask>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#outerGlow)"/>

  <g transform="rotate(-20 256 256)" clip-path="url(#backRingClip)" mask="url(#ringCastShadowMask)" filter="url(#ringSoft)">
    <ellipse cx="256" cy="256" rx="224" ry="58" fill="url(#ringOuterDust)" opacity="0.86"/>
    <ellipse cx="256" cy="256" rx="194" ry="50" fill="none" stroke="url(#ringShade)" stroke-width="5" opacity="0.24"/>
    <ellipse cx="256" cy="256" rx="164" ry="42" fill="none" stroke="url(#ringShade)" stroke-width="8.5" opacity="0.28"/>
  </g>

  <g mask="url(#planetAlphaMask)">
    <g clip-path="url(#sphereClip)">
      <circle cx="256" cy="256" r="96" fill="url(#planetBase)"/>
      <g transform="rotate(-20 256 256)">
        <rect x="130" y="140" width="252" height="232" filter="url(#planetBands)" opacity="0.68"/>
        <ellipse cx="256" cy="212" rx="120" ry="11" fill="#ede9fe" opacity="0.15" filter="url(#softEdge)"/>
        <ellipse cx="256" cy="238" rx="125" ry="15" fill="#c7d2fe" opacity="0.11" filter="url(#softEdge)"/>
        <ellipse cx="256" cy="264" rx="125" ry="12" fill="#4c1d95" opacity="0.20" filter="url(#softEdge)"/>
        <ellipse cx="256" cy="288" rx="116" ry="14" fill="#a5b4fc" opacity="0.09" filter="url(#softEdge)"/>
        <ellipse cx="256" cy="312" rx="102" ry="11" fill="#1e1b4b" opacity="0.24" filter="url(#softEdge)"/>
      </g>
      <radialGradient id="sphereShadow" cx="31%" cy="29%" r="72%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
        <stop offset="48%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="76%" stop-color="#0b091a" stop-opacity="0.54"/>
        <stop offset="100%" stop-color="#060412" stop-opacity="0.82"/>
      </radialGradient>
      <circle cx="256" cy="256" r="96" fill="url(#sphereShadow)"/>
      <circle cx="256" cy="256" r="95" fill="url(#limbRim)"/>
    </g>
  </g>

  <g transform="rotate(-20 256 256)" clip-path="url(#frontRingClip)" filter="url(#ringSoft)">
    <ellipse cx="256" cy="256" rx="224" ry="58" fill="url(#ringOuterDust)" opacity="0.90"/>
    <ellipse cx="256" cy="256" rx="194" ry="50" fill="none" stroke="url(#ringShade)" stroke-width="5" opacity="0.26"/>
    <ellipse cx="256" cy="256" rx="164" ry="42" fill="none" stroke="url(#ringShade)" stroke-width="8.5" opacity="0.32"/>
  </g>
</svg>
