<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="coreSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="flareBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <radialGradient id="animeOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="14%" stop-color="#fffbe8" stop-opacity="0.68"/>
      <stop offset="30%" stop-color="#f0f9ff" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#dff2ff" stop-opacity="0.11"/>
      <stop offset="72%" stop-color="#bae6fd" stop-opacity="0.025"/>
      <stop offset="92%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="animeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1.0"/>
      <stop offset="46%" stop-color="#fffef6" stop-opacity="0.96"/>
      <stop offset="76%" stop-color="#fff3cc" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="anamorphicH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="28%" stop-color="#f0f9ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="72%" stop-color="#f0f9ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="anamorphicV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0"/>
      <stop offset="32%" stop-color="#fffef2" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="68%" stop-color="#fffef2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#animeOuterGlow)"/>

  <ellipse cx="256" cy="256" rx="212" ry="8" fill="url(#anamorphicH)" filter="url(#flareBlur)"/>
  <ellipse cx="256" cy="256" rx="9" ry="136" fill="url(#anamorphicV)" filter="url(#flareBlur)"/>

  <circle cx="256" cy="256" r="76" fill="url(#animeCore)" filter="url(#coreSoft)"/>
  <circle cx="256" cy="256" r="40" fill="#ffffff" opacity="0.95" filter="url(#coreSoft)"/>
</svg>
